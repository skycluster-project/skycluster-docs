{% if versions %}
<div class="pd-version-selector" role="group" aria-label="{{ _('Version selector') }}">
  <label class="pd-version-label" for="pd-version-select">{{ _('Version:') }}</label>
  <div class="pd-version-select-wrap">
    <select id="pd-version-select" onchange="if(this.value) location.href=this.value">
      {%- for item in versions %}
        <option value="{{ item.url }}"
          {%- if current_version and item.name == current_version.name %} selected{% endif %}>
          {{ item.name }}
        </option>
      {%- endfor %}
    </select>
  </div>
</div>
{% endif %}


<style>

/* ---- Base tokens (map to pydata variables, with safe fallbacks) ---- */
:root {
  --vs-fg: var(--pst-color-text, #222);
  --vs-bg: var(--pst-color-background, #fff);
  --vs-muted: var(--pst-color-muted, #6c757d);
  --vs-border: var(--pst-color-border, #d0d7de);
  --vs-accent: var(--pst-color-primary, #3b82f6);
  /* elevated surface: prefer surface if available, else background */
  --vs-bg-elev: var(--pst-color-surface, var(--pst-color-background, #fff));
  --vs-radius: var(--pst-border-radius, .25rem);
  --vs-shadow: var(--pst-box-shadow, 0 1px 2px rgba(0,0,0,.06));
  --vs-font-size: 0.9rem;
}

/* ---- Explicit dark mode from pydata ---- */
html[data-mode="dark"] {
  --vs-fg: var(--pst-color-text, #e6e6e6);
  --vs-bg: var(--pst-color-background, #0b0f19);
  --vs-muted: var(--pst-color-muted, #a0a0ad);
  --vs-border: var(--pst-color-border, #2b2f3a);
  --vs-accent: var(--pst-color-primary, #60a5fa);
  --vs-bg-elev: var(--pst-color-surface, #131826);
  --vs-shadow: var(--pst-box-shadow, 0 1px 2px rgba(0,0,0,.5));
}

/* ---- “Auto” follows OS setting ---- */
@media (prefers-color-scheme: dark) {
  html[data-mode="auto"] {
    --vs-fg: var(--pst-color-text, #e6e6e6);
    --vs-bg: var(--pst-color-background, #0b0f19);
    --vs-muted: var(--pst-color-muted, #a0a0ad);
    --vs-border: var(--pst-color-border, #2b2f3a);
    --vs-accent: var(--pst-color-primary, #60a5fa);
    --vs-bg-elev: var(--pst-color-surface, #131826);
    --vs-shadow: var(--pst-box-shadow, 0 1px 2px rgba(0,0,0,.5));
  }
}

/* ---- Component styles (aligned to pydata sizing) ---- */
.pd-version-selector {
  display: inline-flex;
  align-items: center;
  gap: .5rem;
  margin: 1rem 0;
  color: var(--vs-fg);
  font-size: var(--vs-font-size);
}

.pd-version-label {
  font-weight: 600;
  color: var(--vs-fg);
  margin: 0;
}

.pd-version-select-wrap {
  position: relative;
  display: inline-block;
}

/* custom chevron that inherits currentColor so it adapts to dark */
.pd-version-select-wrap::after {
  content: "";
  position: absolute;
  right: .6rem;
  top: 50%;
  transform: translateY(-50%);
  width: .7rem;
  height: .7rem;
  pointer-events: none;
  color: var(--vs-fg);
  opacity: .8;
  background-image:
    url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>');
}

.pd-version-select-wrap select {
  appearance: none;
  -webkit-appearance: none;
  -moz-appearance: none;

  padding: .45rem 2rem .45rem .65rem;
  border-radius: var(--vs-radius);
  border: 1px solid var(--vs-border);
  background-color: var(--vs-bg-elev);
  color: var(--vs-fg);
  box-shadow: var(--vs-shadow);
  line-height: 1.2;
  min-width: 11ch;
  max-width: 100%;
  font: inherit;
}

/* hover/focus aligned to theme primary */
.pd-version-select-wrap select:hover {
  border-color: color-mix(in oklab, var(--vs-accent) 45%, var(--vs-border));
}

.pd-version-select-wrap select:focus {
  outline: 3px solid color-mix(in oklab, var(--vs-accent) 25%, transparent);
  outline-offset: 1px;
  border-color: var(--vs-accent);
}

/* ensure options remain readable in the OS popup UI */
.pd-version-select-wrap select option { color: initial; }

/* reduced motion */
@media (prefers-reduced-motion: reduce) {
  .pd-version-select-wrap select,
  .pd-version-select-wrap::after { transition: none; }
}


</style>
